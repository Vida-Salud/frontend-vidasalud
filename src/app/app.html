<header>
    <h1>Mi Aplicación Angular</h1>
    
    <nav>
        <a routerLink="/">Inicio</a> | 
        <a routerLink="/profile">Mi Perfil</a>
    </nav>

    <div>
        @if (!isLoggedIn) {
            <button (click)="login()">Iniciar Sesión</button>
        } @else {
            <button (click)="logout()">Cerrar Sesión</button>
        }
    </div>
</header>

<main>
    @if (!isLoggedIn) {
        <section>
            <h2>Bienvenido</h2>
            <p>Por favor inicia sesión para acceder a las secciones protegidas.</p>
        </section>
    }

    <!-- Aquí se renderizan las rutas secundarias como /profile -->
    <router-outlet></router-outlet>
</main>
